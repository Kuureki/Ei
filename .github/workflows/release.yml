name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux-x64
            bun-target: bun-linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            bun-target: bun-linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build shared
        run: bun run build:shared
      - name: Stamp version
        run: sed -i "s/export const EI_VERSION = .*/export const EI_VERSION = \"${{ github.ref_name }}\";/" packages/agent/cli/build/version.ts
      - name: Compile
        working-directory: packages/agent
        run: bun build --compile --target ${{ matrix.bun-target }} --outfile ei-${{ matrix.platform }} cli/main.ts
      - name: Checksums
        working-directory: packages/agent
        run: sha256sum ei-${{ matrix.platform }} > ei-${{ matrix.platform }}.sha256
      - name: Smoke test
        working-directory: packages/agent
        run: ./ei-${{ matrix.platform }} version && ./ei-${{ matrix.platform }} doctor --json --dry-run | head -c 2000
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/agent/ei-${{ matrix.platform }}
            packages/agent/ei-${{ matrix.platform }}.sha256
